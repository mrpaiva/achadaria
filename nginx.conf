server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # www vira o domínio principal (o HTTPS fica no Traefik do Dokploy)
    if ($host = www.achadaria.com) {
        return 301 https://achadaria.com$request_uri;
    }

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Registro interno do gerador do site
    location = /achados.json { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Vídeos e fotos mudam pouco; o nginx já atende pedidos de intervalo (Range), que o player do celular usa
    location ~* \.(mp4|jpg|jpeg|png)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
